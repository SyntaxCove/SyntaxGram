# Windows installer configuration (electron-builder / NSIS).
# License note: the source code is MIT-licensed with additional attribution
# and name-restriction terms — see the LICENSE file for details.
appId: com.igdesktop.app
productName: SyntaxGram
copyright: MIT license with additional terms — see LICENSE
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
asar: true
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - icon.ico
      - tray.png
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SyntaxGram
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: SyntaxGram
